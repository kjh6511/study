<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>shop 등록</title>

</head>
<body>
  <div>
    <form class="shopFrom" action="/shops" method="POST">
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="form-floating mb-3 mb-md-0 input-group">
            <input class="form-control" id="shopNm" name="shopNm" type="text"/>
            <label for="shopNm">shopNm</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating">
            <input class="form-control" id="shopId" name="shopId" type="text"/>
            <label for="shopId">shopId</label>
          </div>
        </div>
      </div>
      <div class="row mb-3">
        <div class="col-md-6">
          <div class="form-floating mb-3 mb-md-0">
            <input class="form-control" id="shopInfo" name="shopInfo" type="text"/>
            <label for="shopInfo">shopInfo</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating mb-3 mb-md-0">
            <input class="form-control" id="shopTel" name="shopTel" type="tel"/>
            <label for="shopInfo">shopTel</label>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-floating mb-3 mb-md-0">
            <input class="form-control" id="shopImg" name="shopImg" type="text"/>
            <label for="shopImg">shopImg</label>
          </div>
        </div>
      </div>
      <div class="mt-4 mb-0">
        <div class="d-grid"><button class="btn btn-primary btn-block" type="submit">Create Account</button></div>
      </div>
    </form>
  </div>
</body>
</html>
