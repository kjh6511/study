<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meal Go - 배달 음식 구독 서비스</title>
    <!-- sb bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/simple-datatables@latest/dist/style.css" rel="stylesheet" />
    <link th:href="@{/css/styles.css}" rel="stylesheet" />
    <script src="https://use.fontawesome.com/releases/v6.1.0/js/all.js" crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/simple-datatables@latest" crossorigin="anonymous"></script>
    <script th:src="@{/js/datatables-simple-demo.js}"></script>

    <!-- Bootstrap core JavaScript-->
    <script th:src="@{/vendor/jquery/jquery.min.js}"></script>
    <script th:src="@{/vendor/bootstrap/js/bootstrap.bundle.min.js}"></script>

    <!-- Core plugin JavaScript-->
    <script th:src="@{/vendor/jquery-easing/jquery.easing.min.js}"></script>

        <style>
        body {
            background-color: #f8fdf8;
        }
         .navbar .nav-link {
        color: #2d6a4f;
        font-weight: 500;
        position: relative;
        padding: 8px 12px;
        transition: all 0.3s ease;
        }

        /* 호버 & 활성화 시 */
        .navbar .nav-link:hover,
        .navbar .nav-link.active {
            font-weight: 700;
            color: #2d6a4f;
        }

        /* 밑줄 효과 */
        .navbar .nav-link::after {
            content: '';
            display: block;
            width: 0;
            height: 3px;
            background-color: #2d6a4f;
            transition: width 0.3s ease;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        /* 호버 또는 활성화 시 밑줄 나타남 */
        .navbar .nav-link:hover::after,
        .navbar .nav-link.active::after {
            width: 100%;
        }
        .hero-section {
            background-color: #d8f3dc;
            padding: 80px 0;
            text-align: center;
        }
        .hero-section h1 {
            color: #2d6a4f;
            font-weight: bold;
        }
        .hero-section p {
            color: #40916c;
            font-size: 1.2rem;
        }
        .subscribe-btn {
            background-color: #40916c;
            color: #fff;
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 30px;
        }
        .food-card img {
            border-radius: 15px;
        }
        footer {
            background-color: #2d6a4f;
            color: #fff;
            padding: 20px 0;
            text-align: center;
            margin-top: 50px;
        }
    </style>
    </head>
<body>

<!-- 네비게이션 바 -->
<!-- 상단바 -->
<nav class="navbar navbar-expand-lg sticky-top shadow-sm" style="background-color: #fff;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#" style="color: #2d6a4f;">MealGo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse justify-content-end" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="#">홈</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/shops}">메뉴</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/categories}">카테고리</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">구독하기</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">문의</a>
                </li>
            </ul>
        </div>
        <nav>
            <a href="/login">로그인</a>
            <a href="/register">회원가입</a>
            <a th:href="@{/meals}">음식</a>
            <a th:href="@{/carts}">장바구니</a>
            <a href="/ai">🥗 식단AI</a>
            <a href="/admin" sec:authorize="hasRole('ADMIN')">관리자 페이지</a>
            <span sec:authentication="name"></span> <!-- 로그인한 사용자 이름 표시 -->
            <form th:action="@{/logout}" method="post">
                <button type="submit">로그아웃</button>
            </form>
        </nav>
    </div>
</nav>

<!-- 메인 히어로 섹션 -->
<section class="hero-section">
    <div sec:authorize="isAuthenticated()">
        <p>환영합니다, <span sec:authentication="name"></span>님!</p>
        <p>당신의 역할: <span sec:authentication="authorities"></span></p>
        <form th:action="@{/logout}" method="post">
            <button type="submit">로그아웃</button>
        </form>
    </div>
    <div class="container">
        <h1 class="display-4 fw-bold">매일 신선한 식사를 문 앞으로!</h1>
        <p class="lead">당신만을 위한 맞춤형 음식 배달 구독 서비스</p>
        <button class="subscribe-btn mt-4">지금 구독하기</button>
    </div>
</section>

<!-- 음식 소개 섹션 -->
<section class="container py-5">
    <h2 class="text-center mb-5" style="color: #2d6a4f;">인기 메뉴</h2>
    <div class="row g-4">
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card food-card shadow-sm h-100">
                <img src="https://source.unsplash.com/400x300/?salad" class="card-img-top" alt="샐러드">
                <div class="card-body">
                    <h5 class="card-title">그린 샐러드</h5>
                    <p class="card-text">신선한 채소와 건강한 드레싱이 어우러진 최고의 샐러드.</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card food-card shadow-sm h-100">
                <img src="https://source.unsplash.com/400x300/?pasta" class="card-img-top" alt="파스타">
                <div class="card-body">
                    <h5 class="card-title">트러플 파스타</h5>
                    <p class="card-text">고급스러운 트러플 향이 가득한 부드러운 파스타.</p>
                </div>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="card food-card shadow-sm h-100">
                <img src="https://source.unsplash.com/400x300/?sandwich" class="card-img-top" alt="샌드위치">
                <div class="card-body">
                    <h5 class="card-title">클래식 샌드위치</h5>
                    <p class="card-text">갓 구운 빵과 신선한 재료로 만든 든든한 한 끼.</p>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- 푸터 -->
<footer>
    <p>&copy; 2025 FreshFood. 모든 권리 보유.</p>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
